<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3: Scanner Kamera (QR & Barcode)</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #eef2f3; }
        .box { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        /* Scanner Container */
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin: 15px auto; }
        #result { font-size: 1.2rem; font-weight: bold; padding: 15px; border-radius: 5px; background: #eee; margin-top: 15px; transition: all 0.3s ease; }
    </style>
</head>
<body>

<div class="box">
    <h2>Web 3: Validasi Scanner Kamera</h2>
    <p>Arahkan kamera ke Barcode atau QR Code</p>
    
    <div id="reader"></div>
    
    <div id="result">Menunggu scan...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        databaseURL: "https://tiketcom-5d185-default-rtdb.asia-southeast1.firebasedatabase.app/" 
    };
    
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let isProcessing = false;
    const resultDiv = document.getElementById("result");

    function playBeep() {
        try {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(880, context.currentTime); 
            oscillator.connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + 0.15); 
        } catch(e) {}
    }

    // Fungsi utama saat Barcode / QR Code berhasil terdeteksi
    function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return; 
        
        isProcessing = true;

        // Trik Utama: Pause scanner agar hardware kamera berhenti membaca gambar untuk sementara waktu
        try {
            html5QrcodeScanner.pause(true); 
        } catch (e) {
            console.log("Gagal menjeda scanner:", e);
        }

        const hasilScan = decodedText.trim();
        resultDiv.innerHTML = "Memvalidasi kode...";
        resultDiv.style.background = "#eee"; resultDiv.style.color = "#000";

        // Hubungkan ke Firebase jalankan pencocokan data
        get(ref(database, 'sistem/riwayat_kode')).then((snapshot) => {
            let matches = false;

            if (snapshot.exists()) {
                const semuaRiwayat = snapshot.val();
                for (let key in semuaRiwayat) {
                    if (semuaRiwayat[key].angka === hasilScan) {
                        matches = true;
                        break; 
                    }
                }
            }

            if (matches) {
                playBeep();
                resultDiv.style.background = "#d4edda"; resultDiv.style.color = "#155724";
                resultDiv.innerHTML = `✅ VALID: ${hasilScan}`;
                
                setTimeout(() => {
                    alert(`🎉 BERHASIL!\nKode [${hasilScan}] terdaftar & sesuai.`);
                    // Lanjutkan pemindaian kembali setelah alert ditutup
                    bukaKembaliScanner();
                }, 200);
            } else {
                resultDiv.style.background = "#f8d7da"; resultDiv.style.color = "#721c24";
                resultDiv.innerHTML = `❌ GAGAL: ${hasilScan}`;
                
                setTimeout(() => {
                    alert(`🚨 GAGAL!\nKode [${hasilScan}] tidak ditemukan.`);
                    // Lanjutkan pemindaian kembali setelah alert ditutup
                    bukaKembaliScanner();
                }, 200);
            }
        }).catch((err) => { 
            console.error(err);
            bukaKembaliScanner();
        });
    }

    // Fungsi pembantu untuk mengaktifkan kembali scanner setelah jeda
    function bukaKembaliScanner() {
        setTimeout(() => {
            try {
                html5QrcodeScanner.resume();
            } catch (e) {
                console.log("Gagal menjalankan kembali scanner:", e);
            }
            isProcessing = false;
        }, 500); // Diberi delay setengah detik agar kamera tidak langsung menyambar QR yang sama
    }

    function onScanFailure(error) {
        // Dibiarkan kosong agar tidak memenuhi console log.
    }

    // Konfigurasi Scanner
    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 15, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                return {
                    width: Math.floor(viewfinderWidth * 0.75),
                    height: Math.floor(viewfinderHeight * 0.45)
                };
            },
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true 
            },
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        },
        /* verbose= */ false
    );

    // Jalankan Scanner
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>
</body>
</html>
